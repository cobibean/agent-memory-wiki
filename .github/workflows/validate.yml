name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tools/validate.py
      - run: bash -n scripts/install-hermes.sh
      - run: bash -n scripts/wiki-janitor-cron-wrapper.sh.example
